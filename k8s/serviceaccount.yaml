apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-dashboard
  namespace: llama-stack-rag
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-dashboard-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["clusterqueues", "localqueues", "workloads", "resourceflavors"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-dashboard-reader
subjects:
  - kind: ServiceAccount
    name: gpu-dashboard
    namespace: llama-stack-rag
roleRef:
  kind: ClusterRole
  name: gpu-dashboard-reader
  apiGroup: rbac.authorization.k8s.io
---
# Thanos/Prometheus access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-dashboard-monitoring
subjects:
  - kind: ServiceAccount
    name: gpu-dashboard
    namespace: llama-stack-rag
roleRef:
  kind: ClusterRole
  name: cluster-monitoring-view
  apiGroup: rbac.authorization.k8s.io
